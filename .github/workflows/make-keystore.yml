name: Generate Keystore
on:
  workflow_dispatch:
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "21"
          
      - name: Generate keystore.jks
        run: |
          keytool -genkeypair -v \
            -keystore keystore.jks \
            -storetype JKS \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias appmarket \
            -storepass appmarket -keypass appmarket \
            -dname "CN=Qi_Serein, OU=Dev, O=Dev, L=Hefei, ST=Anhui, C=CN"
          ls -lh keystore.jks
      - name: Upload keystore
        uses: actions/upload-artifact@v7
        with:
          name: keystore
          path: keystore.jks
          if-no-files-found: error
