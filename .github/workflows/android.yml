name: Android CI

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    tags:
      - "v*"
    paths-ignore:
      - "README.md"
      - "doc/*"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-37" "build-tools;37.0.0" || \
            "$SDKMANAGER" "platform-tools" "platforms;android-37"

      - name: Check keystore
        run: |
          test -f keystore.jks || (echo "仓库根目录缺少 keystore.jks，先跑 Generate Keystore 并上传" && exit 1)
          ls -l keystore.jks

      - name: Build Release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/keystore.jks
          KEYSTORE_PASS: appmarket
          KEY_ALIAS: appmarket
          KEY_PASSWORD: appmarket
        run: ./gradlew :app:android:assembleRelease --stacktrace

      - name: Show APK info and signature
        run: |
          APK=$(ls app/android/build/outputs/apk/release/*.apk | head -n 1)
          ls -lh "$APK"
          sha256sum "$APK" | tee sha256.txt
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | tail -n 1)
          "$BT/apksigner" verify --print-certs "$APK" | head -n 20

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: AppMarket-release-apk
          path: |
            app/android/build/outputs/apk/release/*.apk
            sha256.txt
          if-no-files-found: error
